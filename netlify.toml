# استضافة «دفتري» على Netlify: الموقع (للآيفون والكمبيوتر) + ملف تطبيق أندرويد
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/dist/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=Daftari.apk"
    Cache-Control = "no-cache"
